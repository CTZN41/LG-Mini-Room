<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LG 미니룸</title>
  <script>
    // Keep existing shared links while using the same isometric room at every entry.
    const target=new URL('/editor'+location.search,location.href);
    const space=location.hash.slice(1);
    if(['menu','example','dream','my'].includes(space))target.searchParams.set('space',space);
    else if(!target.searchParams.has('space')&&(location.hash||location.search))target.searchParams.set('space','menu');
    location.replace(target.href);
  </script>
</head>
<body><a href="/editor">LG 미니룸 열기</a></body>
</html>
