<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9ad0fa"><title>LG 미니룸 소개</title><link rel="stylesheet" href="/login.css"><script defer src="/onboarding.js"></script></head>
<body><main class="intro" id="journey">
<section class="welcome" id="door" aria-labelledby="doorTitle">
  <div class="world" aria-hidden="true"><img class="grass" src="/onboarding/grass.svg" alt=""><img class="door-art" src="/onboarding/door.svg" alt=""><img class="door-cat" src="/onboarding/door-cat.svg" alt=""></div>
  <div class="intro-status" aria-hidden="true"><time></time><img src="/onboarding/signals.svg" alt=""></div>
  <div class="door-copy"><p class="brands"><b>LG ThinQ</b> × <b>MINIROOM</b></p><h1 id="doorTitle" tabindex="-1">잠깐, 여기서부터는<br>도트 세상이에요</h1><p>ThinQ 안에 숨어 있는 작은 방, LG 미니룸으로 들어가요. 내 방을 꾸미고, 가전을 놓아 보고, 루틴을 미리 살아 볼 수 있어요.</p></div>
  <div class="door-actions"><a class="button dark" href="#loading">문 열고 들어가기</a><a class="later" href="/?tab=devices">다음에 할게요</a></div>
</section>
<section class="loading sky" id="loading" hidden aria-label="도트 세상 로딩"><img width="96" src="/onboarding/loading-cat.svg" alt=""><b>LOADING...</b><div class="loadbar"></div><strong>내 방을 도트로 바꾸는 중…</strong></section>
<section class="slides sky" id="slides" hidden aria-labelledby="slideTitle">
  <div class="intro-status" aria-hidden="true"><time></time><img src="/onboarding/signals.svg" alt=""></div>
  <div class="steps"><strong id="progress"></strong><button id="skip">건너뛰기</button></div>
  <article class="sheet"><div class="vignette" id="preview">
    <img class="room-art" src="/onboarding/room.svg" alt=""><div id="sceneHints"></div>
    <div class="shared" hidden><div>📺 지수의 “영화 보기” <b>가져오기</b></div><div>🌙 도준의 “잘 준비” <b>가져오기</b></div><small>LV.12　 도감 18　 🪙 300</small></div>
  </div><small class="pill" id="mode"></small><h1 tabindex="-1" id="slideTitle"></h1><p id="detail"></p></article>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><button class="primary" id="next"></button>
</section></main></body></html>
