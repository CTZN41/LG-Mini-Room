<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#add9fc"><title>미니룸 로그인 · LG ThinQ</title><link rel="stylesheet" href="/login.css"><script defer src="/login.js"></script></head>
<body><main class="account sky"><p class="brands"><b>LG ThinQ</b> × <b>MINIROOM</b></p>
<section class="sheet" aria-labelledby="title"><h1 id="title">미니룸 로그인</h1>
<form id="login"><label>아이디<input name="username" required autocomplete="username" maxlength="40" autocapitalize="none" spellcheck="false"></label>
<label>비밀번호<input name="password" required type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password" placeholder="숫자 6자리"></label>
<button class="primary">로그인</button><button type="button" data-mode="join">회원가입</button>
</form>
<form id="join" hidden><label>이름<input name="name" autocomplete="name" maxlength="60" required></label>
<label>아이디<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required></label>
<label>비밀번호<input name="password" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="new-password" placeholder="숫자 6자리" required></label>
<label>닉네임<input name="nickname" autocomplete="nickname" maxlength="30" placeholder="다른 회원과 같아도 돼요" required></label>
<button class="primary">가입하고 시작하기</button><button type="button" class="text" data-mode="login">로그인으로 돌아가기</button></form>
<p role="status" id="status"></p></section><a class="replay" href="/miniroom/start?replay=1">미니룸 소개 다시 보기</a></main></body></html>
